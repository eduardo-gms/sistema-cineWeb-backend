version: '3.8'

services:
  backend:
    build: .
    container_name: cineweb-backend
    ports:
      - '3000:3000'
    environment:
      - DATABASE_URL=postgresql://postgres:60451@cineweb-db:5432/cineweb?schema=public
      - JWT_SECRET=cineweb-jwt-secret-dev-2026
      - JWT_REFRESH_SECRET=cineweb-jwt-refresh-secret-dev-2026
      - PORT=3000
    networks:
      - cineweb-network
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules

  db:
    image: postgres:15
    container_name: cineweb-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 60451
      POSTGRES_DB: cineweb
    ports:
      - '5432:5432'
    networks:
      - cineweb-network
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

networks:
  cineweb-network:
    external: true
